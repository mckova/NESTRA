openapi: 3.1.0
info:
  title: NESTRA Gateway API
  version: 2.0.0
  description: Evidence-aware routing between retrieval-only and guarded LLM tiers.
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  service: { const: nestra }
                  version: { type: string }
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Stored project identifiers.
  /v1/projects/{projectId}:
    get:
      operationId: inspectProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project metadata and compilation statistics. }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /v1/projects/{projectId}/ingest:
    post:
      operationId: ingestProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Document" }
                defaultTrust: { enum: [trusted, untrusted] }
      responses:
        "201": { description: Project memory compiled and persisted. }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /v1/route:
    post:
      operationId: planRoute
      requestBody:
        $ref: "#/components/requestBodies/QueryBody"
      responses:
        "200": { description: Route decision without a model call. }
  /v1/query:
    post:
      operationId: query
      requestBody:
        $ref: "#/components/requestBodies/QueryBody"
      responses:
        "200":
          description: Retrieval or guarded model result.
          content:
            application/json:
              schema:
                $ref: "../schemas/query-result.schema.json"
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /v1/metrics:
    get:
      operationId: metrics
      responses:
        "200": { description: Aggregate route, latency, call, token, and alert counters. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
  schemas:
    Document:
      type: object
      required: [title, text]
      properties:
        title: { type: string }
        text: { type: string }
        sourceUri: { type: [string, "null"] }
        trust: { enum: [trusted, untrusted] }
        sensitivity: { type: number, minimum: 0, maximum: 1 }
    Query:
      type: object
      required: [projectId, question]
      properties:
        projectId: { type: string }
        question: { type: string }
        mode: { enum: [auto, retrieval] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  requestBodies:
    QueryBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Query"
  responses:
    ErrorResponse:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
