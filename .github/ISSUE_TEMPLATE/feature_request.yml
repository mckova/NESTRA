name: Feature request
description: Propose a scoped improvement with a measurable outcome.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Measurable outcome
      description: How should quality, latency, tokens, safety, or usability improve?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Routing, Retrieval, Provider, Memory, Security, Observability, CLI, Gateway, Evaluation]
    validations:
      required: true
