name: Bug report
description: Report a reproducible defect in NESTRA.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, prompts containing private data, or production memory snapshots.
  - type: input
    id: version
    attributes:
      label: NESTRA version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands or code using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
